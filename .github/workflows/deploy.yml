name: Deploy

# main에 push되면 자동 배포된다 (PR 리뷰 단계 없음 — 2인 프로젝트라 즉시 반영이
# 목적). 이 저장소에 push 권한이 있는 사람 누구나(공동작업자 포함) 이 워크플로를
# 실행시킬 수 있다는 뜻이므로, main에 올리기 전에 로컬에서 검증할 것.
on:
  push:
    branches: [main]
  # 코드 변경 없이 다시 배포하고 싶을 때 (Actions 탭 → Deploy → Run workflow).
  # 롤백 후 재배포, 실패한 배포 재시도, 시크릿 교체 후 확인 등에 쓴다.
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        type: choice
        options: [both, backend, frontend]
        default: both

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      # head_commit만 보면 여러 커밋이 한 번에 push됐을 때 앞쪽 커밋의 변경을
      # 놓친다 — paths-filter가 push 전체 범위(before..after)를 정확히 비교한다.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend-next/**'
      # 수동 실행에는 비교할 before/after가 없으므로 선택한 대상을 그대로 쓴다.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$TARGET" in
              both)     backend=true;  frontend=true  ;;
              backend)  backend=true;  frontend=false ;;
              frontend) backend=false; frontend=true  ;;
              *)        backend=false; frontend=false ;;
            esac
          else
            backend="${FILTER_BACKEND:-false}"
            frontend="${FILTER_FRONTEND:-false}"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"

  deploy-backend:
    name: Railway (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          # 토큰 종류에 따라 CLI가 읽는 변수명이 다르다. 계정/워크스페이스
          # 토큰(railway.com/account/tokens에서 발급)은 RAILWAY_API_TOKEN,
          # 프로젝트 전용 토큰만 RAILWAY_TOKEN이다. 여기 저장된 시크릿은
          # 계정 토큰이라 API 쪽으로 넘긴다 (RAILWAY_TOKEN으로 주면 Unauthorized).
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # 반드시 레포 루트에서 실행한다 — Railway 서비스의 root directory가
        # /backend로 설정돼 있어서, backend/ 안에서 올리면 업로드된 아카이브에
        # backend/ 서브폴더가 없어 빌드가 "directory backend does not exist"로
        # 실패한다 (2026-07-19 실측 확인).
        # RAILWAY_TOKEN이 프로젝트 전용 토큰이 아니라 워크스페이스/계정 토큰일
        # 수 있어 -p로 프로젝트를 명시한다 (Railway가 프로젝트 토큰을
        # 계정 설정(railway.com/account/tokens)으로 옮기면서 CLI가 더 이상
        # 자동으로 프로젝트를 추론하지 못하는 경우가 있다).
        # -p를 주면 -e도 반드시 함께 줘야 한다 (CLI가
        # "--environment is required when using --project"로 거부).
        # ⚠️ --service는 Railway 서비스의 **현재 이름**이다. 2026-09-10에 서비스를
        # space-syntax → backend로 바꿨는데 여기를 안 고쳐서 그날부터 9/18까지
        # backend 배포가 한 건도 안 됐다 (GitHub은 초록, Railway는 조용). 서비스
        # 이름을 바꾸면 이 줄도 같이 바꾼다.
        run: railway up --detach --service backend -p cb570b68-7bde-4c56-8a4e-bd30da09d3d0 -e production

  deploy-frontend:
    name: Firebase (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: frontend-next
        run: npm ci
      - name: Build static export
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_API_BASE_URL: https://space-syntax-production.up.railway.app
          # NEXT_PUBLIC_* 값은 빌드 시점에 클라이언트 번들에 그대로 박힌다 —
          # 런타임에 안 읽는다. 이 값이 없으면 카카오 지도가 로드되지 않는다.
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
        run: node scripts/build-firebase-static.mjs
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools@latest deploy --only hosting --project real-estate-79e2a --non-interactive --token "$FIREBASE_TOKEN"
